services:
  - type: web
    name: real-madrid-tactical-dashboard
    env: python
    plan: free
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 2 --timeout 120 --bind 0.0.0.0:$PORT app.app:server
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # DATA_ROOT points to the folder containing: LaLiga/, Copa del Rey/, UEFA Champions League/
      # data/ subfolder is committed to the repo with only Real Madrid match files
      - key: DATA_ROOT
        value: /opt/render/project/src/data
