services:
  - type: web
    name: real-madrid-tactical-dashboard
    env: python
    plan: free
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    # Dash app served via gunicorn. wsgi.py puts dashboard/ on sys.path then
    # imports server from dashboard/app/app.py.
    startCommand: gunicorn wsgi:server --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # Canonical clean dataset bundled at dashboard/data (Real Madrid matches only,
      # all 3 competitions x 2 seasons, verified 0 corrupt files). On Render the
      # repo is checked out at /opt/render/project/src.
      - key: DATA_ROOT
        value: /opt/render/project/src/dashboard/data
